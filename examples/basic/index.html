<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeVRM engine example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131a; font-family: system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; }
      #hint {
        position: absolute; left: 16px; bottom: 16px; padding: 8px 12px; border-radius: 6px;
        background: rgba(16, 19, 26, 0.6); color: #f2f4f8; font-size: 13px; pointer-events: none;
      }
      #stage.dragging::after {
        content: ''; position: absolute; inset: 12px; border: 2px dashed rgba(255, 255, 255, 0.8); border-radius: 12px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="hint">VRM ファイルをドロップすると差し替えます</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
